{% extends 'base.html' %}
{% block title %}Registrarse | Auto Cars{% endblock %}
{% block content %}
<section class="form-section">
	<div class="form-card">
		<div class="form-mark">A</div>
		<p class="eyebrow">Crea tu cuenta</p>
		<h1>Tu próximo carro<br><em>te espera.</em></h1>
		<p class="form-intro">Regístrate para guardar tu historial de compras simuladas.</p>
		<form method="post" class="stack-form">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<label for="name">Nombre</label>
			<input id="name" name="name" type="text" required>
			<label for="email">Correo</label>
			<input id="email" name="email" type="email" required>
			<label for="password">Contraseña</label>
			<input id="password" name="password" type="password" minlength="10" required>
			<label for="confirm_password">Confirmar contraseña</label>
			<input id="confirm_password" name="confirm_password" type="password" minlength="10" required>
			<button class="button button-primary" type="submit">Crear cuenta <span aria-hidden="true">↗</span></button>
		</form>
		<p class="form-note">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Iniciar sesión</a></p>
	</div>
</section>
{% endblock %}
