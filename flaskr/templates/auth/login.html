{% extends 'base.html' %}
{% block title %}Iniciar sesión | Auto Cars{% endblock %}
{% block content %}
<section class="form-section">
	<div class="form-card">
		<div class="form-mark">A</div>
		<p class="eyebrow">Área privada</p>
		<h1>Bienvenido<br><em>de nuevo.</em></h1>
		<p class="form-intro">Ingresa para continuar explorando tu próximo vehículo.</p>
		<form method="post" class="stack-form">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<label for="email">Correo</label>
			<input id="email" name="email" type="email" required>
			<label for="password">Contraseña</label>
			<input id="password" name="password" type="password" required>
			<button class="button button-primary" type="submit">Iniciar sesión <span aria-hidden="true">↗</span></button>
		</form>
		<p class="form-note">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Registrarse</a></p>
	</div>
</section>
{% endblock %}
